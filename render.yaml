services:
  - type: web
    name: sports-scheduler
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sports-scheduler-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: sports-scheduler-db
    databaseName: sports_scheduler_prod
    user: sports_scheduler_user
    plan: free
    region: oregon
